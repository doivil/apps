<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winterdienst BVB</title>
<meta name="theme-color" content="#e2231a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Winterdienst BVB">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="icon" type="image/png" href="icon-192.png?v=1">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f4f2; --surface:#fff; --sunk:#e9ebe7; --fg:#1d2226; --muted:#5d666d; --line:#d3d7d1;
  --accent:#e2231a; --steel:#2f4a5c; --link:#2f4a5c;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --r:6px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161a1d; --surface:#1f2428; --sunk:#262c31; --fg:#e8eae6; --muted:#9aa3a9; --line:#343b41;
  --steel:#8fb3c9; --link:#8fb3c9; color-scheme:dark}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
header{display:grid;gap:14px;padding-bottom:14px;border-bottom:3px solid var(--accent);margin-bottom:16px}
.logo{display:block;width:100%;height:auto;background:#fff;border-radius:4px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;margin:0}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:6px}
.tab{display:flex;text-align:left;align-items:center;gap:8px;min-height:48px;padding:6px 14px 6px 6px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);font:600 16px var(--f-body);cursor:pointer}
.tab[aria-selected=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.nr{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:4px;color:#fff;font:700 22px/1 var(--f-display)}
.tab small{display:block;font-weight:400;font-size:12px;color:var(--muted);line-height:1.1}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted);margin:20px 0 6px}
ol{list-style:none;margin:0;padding:0;position:relative}
ol::before{content:"";position:absolute;left:15px;top:28px;bottom:28px;width:6px;border-radius:3px;background:var(--lc)}
li{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) 92px;gap:12px;align-items:center;padding:7px 0}
.dot{width:22px;height:22px;margin-left:7px;border-radius:50%;background:var(--surface);border:5px solid var(--lc);z-index:1}
.name{font:600 21px/1.15 var(--f-display)}
.maps{display:inline-flex;align-items:center;min-height:36px;color:var(--link);font-weight:600;font-size:14px;text-decoration:none}
.thumb{position:relative;width:92px;height:92px;border:0;padding:0;border-radius:var(--r);overflow:hidden;background:var(--sunk);cursor:pointer;box-shadow:0 1px 4px rgb(0 0 0/.15)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;right:4px;bottom:4px;background:rgb(0 0 0/.65);color:#fff;font-size:12px;padding:1px 7px;border-radius:9px}
.nobild{display:grid;place-items:center;width:92px;height:92px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:12px;text-align:center;line-height:1.2;padding:6px}
.note{margin-top:22px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.msg{padding:20px 0;color:var(--muted)}
#v{position:fixed;inset:0;background:#000;color:#fff;display:none;flex-direction:column;z-index:10}
#v.on{display:flex}
.vt{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px}
.vt b{font:700 24px/1.1 var(--f-display)}
.vt small{opacity:.7;font-size:14px}
.x{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:rgb(255 255 255/.15);color:#fff;font-size:26px;line-height:1;cursor:pointer}
.strip{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip figure{flex:0 0 100%;margin:0;scroll-snap-align:center;display:grid;place-items:center;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
.strip img{max-width:100%;max-height:100%;object-fit:contain}
.vb{display:flex;gap:10px;align-items:center;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.vb a{flex:1;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:12px;border-radius:var(--r);min-height:44px}
.nav{width:48px;height:44px;border-radius:var(--r);border:0;background:rgb(255 255 255/.15);color:#fff;font-size:22px;cursor:pointer}
.nav:disabled{opacity:.3}
.pg{font-size:14px;opacity:.75;min-width:44px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="logo.png" alt="H. Reich AG – Tiefbau, Strassenbau, Pflästerungen">
    <div><h1>Winterdienst BVB</h1><div class="sub">Tramhaltestellen. Bild antippen für die grosse Ansicht mit Markierung.</div></div>
  </header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <main id="m"><p class="msg">Lade Haltestellen …</p></main>
</div>

<div id="v" role="dialog" aria-modal="true" aria-label="Bild der Haltestelle">
  <div class="vt"><div style="flex:1"><b id="vn"></b><br><small id="vo"></small></div><button class="x" id="vx" aria-label="Schliessen">×</button></div>
  <div class="strip" id="vs"></div>
  <div class="vb"><button class="nav" id="vp" aria-label="Vorherige Haltestelle">‹</button><span class="pg" id="vc"></span><a id="vm" href="#" target="_blank" rel="noopener">In Google Maps öffnen</a><button class="nav" id="vnx" aria-label="Nächste Haltestelle">›</button></div>
</div>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G='https://www.google.com/maps/search/?api=1&query=';
const mapsUrl=s=>G+encodeURIComponent(s.maps||(s.name+' '+(s.ort||'')));
const img=f=>'img/'+encodeURIComponent(f);
let L=[],line=null,cur=0,list=[];

function pick(){const h=location.hash.replace('#linie-','');line=L.find(l=>l.nr===h)||L[0];render()}
function render(){
  $('tabs').innerHTML=L.map(l=>`<button class="tab" role="tab" aria-selected="${l===line}" data-nr="${esc(l.nr)}"><span class="nr" style="background:${esc(l.farbe||'#555')}">${esc(l.nr)}</span><span>Linie ${esc(l.nr)}<small>${esc(l.titel||'')}</small></span></button>`).join('');
  list=line.haltestellen||[];
  const orte=[...new Set(list.map(s=>s.ort||''))];
  $('m').style.setProperty('--lc',line.farbe||'#555');
  $('m').innerHTML=(list.length?orte.map(o=>`<h2>${esc(o)}</h2><ol>`+list.map((s,k)=>(s.ort||'')!==o?'':`<li><div class="dot"></div><div><div class="name">${esc(s.name)}</div><a class="maps" href="${esc(mapsUrl(s))}" target="_blank" rel="noopener">Google Maps ↗</a></div>${(s.bilder||[]).length?`<button class="thumb" data-k="${k}" aria-label="Bild ${esc(s.name)} anzeigen"><img src="${esc(img(s.bilder[0]))}" alt="" loading="lazy">${s.bilder.length>1?`<span>${s.bilder.length} Bilder</span>`:''}</button>`:'<div class="nobild">Noch kein Bild</div>'}</li>`).join('')+'</ol>').join(''):'<p class="msg">Für diese Linie sind noch keine Haltestellen erfasst.</p>')
   +(line.nr==='3'?'<p class="note">Nur jedes zweite Tram der Linie 3 fährt bis Gare de Saint-Louis, die übrigen wenden am Burgfelderhof.</p>':'');
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){history.replaceState(null,'','#linie-'+b.dataset.nr);pick();window.scrollTo(0,0)}});
window.addEventListener('hashchange',pick);

const v=$('v'),vs=$('vs');
const withImg=()=>list.map((s,k)=>k).filter(k=>(list[k].bilder||[]).length);
function show(k){cur=k;const s=list[k],ix=withImg(),p=ix.indexOf(k);
  $('vn').textContent=s.name;
  $('vo').textContent=(s.ort||'')+(s.bilder.length>1?' · wischen für weiteres Bild':'');
  $('vm').href=mapsUrl(s);
  $('vc').textContent=(p+1)+'/'+ix.length;
  $('vp').disabled=p<=0;$('vnx').disabled=p>=ix.length-1;
  vs.innerHTML=s.bilder.map(f=>`<figure><img src="${esc(img(f))}" alt="Luftbild ${esc(s.name)}"></figure>`).join('');vs.scrollLeft=0;
  if(!v.classList.contains('on')){v.classList.add('on');document.body.style.overflow='hidden';try{history.pushState({v:1},'')}catch(e){}}
}
function close(){v.classList.remove('on');document.body.style.overflow=''}
function step(d){const ix=withImg(),p=ix.indexOf(cur)+d;if(p>=0&&p<ix.length)show(ix[p])}
$('m').addEventListener('click',e=>{const b=e.target.closest('.thumb');if(b)show(+b.dataset.k)});
$('vx').onclick=()=>{close();try{if(history.state&&history.state.v)history.back()}catch(e){}};
window.addEventListener('popstate',close);
$('vp').onclick=()=>step(-1);$('vnx').onclick=()=>step(1);
document.addEventListener('keydown',e=>{if(!v.classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});

fetch('haltestellen.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{L=d.linien||[];if(!L.length)throw 0;pick()}).catch(()=>{$('m').innerHTML='<p class="msg">Haltestellen konnten nicht geladen werden. Bitte Verbindung prüfen und neu laden.</p>'});
}
</script>
</body>
</html>
