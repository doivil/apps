<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winterdienst BAG &amp; HRAG</title>
<meta name="theme-color" content="#e2231a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Winterdienst BAG &amp; HRAG">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f4f2; --surface:#fff; --sunk:#e9ebe7; --fg:#1d2226; --muted:#5d666d; --line:#d3d7d1;
  --accent:#e2231a; --steel:#2f4a5c; --link:#2f4a5c;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --r:6px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161a1d; --surface:#1f2428; --sunk:#262c31; --fg:#e8eae6; --muted:#9aa3a9; --line:#343b41;
  --steel:#8fb3c9; --link:#8fb3c9; color-scheme:dark}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
header{display:grid;gap:14px;padding-bottom:14px;border-bottom:3px solid var(--accent);margin-bottom:16px}
.logo{display:block;width:100%;height:auto;background:#fff;border-radius:4px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;margin:0}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.auf{border:1.5px solid var(--line);border-radius:var(--r);padding:8px 8px 8px;margin-bottom:10px;background:var(--surface)}
.auf h3{margin:0 0 6px 2px;font:700 15px/1.2 var(--f-display);letter-spacing:.02em;color:var(--muted)}
.auf.bvb{border-left:5px solid #e2231a}.auf.let{border-left:5px solid #2e7d4f}.auf.all{border-left:5px solid #6b4fa0}
.auf .tab{background:var(--bg)}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tab{display:flex;text-align:left;align-items:center;gap:8px;min-height:48px;padding:6px 14px 6px 6px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);font:600 16px var(--f-body);cursor:pointer}
.tab[aria-selected=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.nr{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:4px;color:#fff;font:700 22px/1 var(--f-display)}
.tab small{display:block;font-weight:400;font-size:12px;color:var(--muted);line-height:1.1}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted);margin:20px 0 6px}
ol{list-style:none;margin:0;padding:0;position:relative}
ol::before{content:"";position:absolute;left:15px;top:28px;bottom:28px;width:6px;border-radius:3px;background:var(--lc)}
li{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) 92px;gap:12px;align-items:center;padding:7px 0}
.dot{width:22px;height:22px;margin-left:7px;border-radius:50%;background:var(--surface);border:5px solid var(--lc);z-index:1}
.name{font:600 21px/1.15 var(--f-display)}
.maps{display:inline-flex;align-items:center;min-height:36px;color:var(--link);font-weight:600;font-size:14px;text-decoration:none}
.thumb{position:relative;width:92px;height:92px;border:0;padding:0;border-radius:var(--r);overflow:hidden;background:var(--sunk);cursor:pointer;box-shadow:0 1px 4px rgb(0 0 0/.15)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;right:4px;bottom:4px;background:rgb(0 0 0/.65);color:#fff;font-size:12px;padding:1px 7px;border-radius:9px}
.nobild{display:grid;place-items:center;width:92px;height:92px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:12px;text-align:center;line-height:1.2;padding:6px}
.note{margin-top:22px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.msg{padding:20px 0;color:var(--muted)}
.team{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.team li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r)}
.team b{display:block;font:600 19px/1.15 var(--f-display)}
.team small{color:var(--muted);font-size:13px}
.call{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:var(--r);background:var(--accent);color:#fff;font-weight:600;text-decoration:none;white-space:nowrap}
.call span{display:block;font-weight:400;font-size:12px;opacity:.9}
.call{flex-direction:column;line-height:1.15}
.miss{color:var(--muted);font-size:13px;white-space:nowrap}
.pinf{display:grid;gap:10px;max-width:320px;margin-top:10px}
.pinf input{font:inherit;font-size:20px;letter-spacing:.2em;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);width:100%}
.pinf button,.lnk{font:600 16px var(--f-body);min-height:46px;border:0;border-radius:var(--r);background:var(--steel);color:#fff;cursor:pointer}
.lnk{background:none;color:var(--link);min-height:40px;padding:0;text-decoration:underline}
.err{color:#b3261e;font-size:14px}
.team b .grp{font-weight:500;color:var(--muted)}
.team li.hl .grp{color:#3d3a20}
.team li.hl{background:#ffd60a;border-color:#e0b800;color:#1d2226}
.team li.hl small{color:#3d3a20}
.tab.tm .nr{background:var(--steel)}
.tab.ab .nr{background:var(--accent)}
.tab.al .nr{background:#2e7d4f}
.tab.ex .nr{background:#1d4f91;font-size:13px;white-space:nowrap}
.auf.ext{border-left:5px solid #1d4f91}
.steps.let .n{background:#2e7d4f}
.tab.pk .nr{background:#6b4fa0}
.pnav{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;align-items:center;margin:4px 0 6px}
.pnav button{min-height:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);font-size:22px;cursor:pointer}
.pnav b{display:block;text-align:center;font:700 22px/1.1 var(--f-display)}
.pnav small{display:block;text-align:center;color:var(--muted);font-size:13px}
.today{display:block;margin:0 auto 4px;border:0;background:none;color:var(--link);font:600 14px var(--f-body);text-decoration:underline;min-height:36px;cursor:pointer}
.pseg{display:inline-flex;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0 0 8px}
.pseg button{min-height:40px;padding:0 18px;border:0;background:var(--surface);color:var(--fg);font:600 15px var(--f-body);cursor:pointer}
.pseg button[aria-pressed=true]{background:#6b4fa0;color:#fff}
.ptw{overflow-x:auto;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
.ptab{border-collapse:collapse;font-size:13px}
.ptab th,.ptab td{border:1px solid var(--line);min-width:28px;height:30px;text-align:center;padding:0 2px}
.ptab thead th{font-weight:600;line-height:1.1;font-size:12px}
.ptab thead th span{display:block;font-weight:400;color:var(--muted);font-size:10px}
.ptab .tn{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;white-space:nowrap;padding:0 8px;font-weight:600;min-width:130px}
.ptab .tg th{position:sticky;left:0;background:var(--sunk);text-align:left;padding:4px 8px;font-size:12px;color:var(--muted)}
.ptab .we{background:var(--sunk)}
.ptab td.on{background:#6b4fa0;color:#fff;font-size:10px}
.ptab td.nt{background:#fde2e0;color:#b3261e;font-weight:700;cursor:pointer}
.ptab .td{outline:2px solid #e2231a;outline-offset:-2px}
.aa{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.aa li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;padding:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);align-items:start}
.aa .bx{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r);background:#1d4f91;color:#fff;font:700 26px/1 var(--f-display)}
.aa b{display:block;font:600 20px/1.15 var(--f-display)}
.aa ul{margin:6px 0 8px;padding-left:18px;font-size:14px;color:var(--muted)}
.aa .open{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:0;border-radius:var(--r);background:#1d4f91;color:#fff;font:600 15px var(--f-body);cursor:pointer}
#pv{position:fixed;inset:0;background:#2b2f33;color:#fff;display:none;flex-direction:column;z-index:11}
#pv.on{display:flex}
#pv .pvs{flex:1;overflow:auto;padding:8px;touch-action:pan-x pan-y pinch-zoom}
#pv canvas{display:block;width:100%;height:auto;margin:0 auto 10px;background:#fff;box-shadow:0 2px 8px rgb(0 0 0/.4)}
#pv .msg{color:#ddd;text-align:center;padding:40px 10px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pday{display:block;text-align:left;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);cursor:pointer}
.pday.now{border-color:#6b4fa0;box-shadow:inset 4px 0 0 #6b4fa0}
.pdh{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.pdh b{font:700 19px/1.1 var(--f-display)}
.pdh span{font-size:12px;font-weight:600;color:#fff;background:#6b4fa0;border-radius:8px;padding:1px 7px}
.pgr{display:grid;grid-template-columns:minmax(0,1fr);gap:0;font-size:14px;line-height:1.35;padding:2px 0}
.pgl{font-weight:600;color:var(--muted);font-size:12px}
.pgr em{font-style:normal;color:#b3261e;font-size:12px}
.team .st{display:block;font-size:13px;font-weight:600;color:#b3261e}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:start;gap:12px;padding:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r)}
.steps li.key{border-color:#e0b800;box-shadow:inset 4px 0 0 #ffd60a}
.steps .n{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;font:700 20px/1 var(--f-display)}
.steps b{display:block;font:600 20px/1.15 var(--f-display);margin-top:6px}
.steps p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.steps .calls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.steps .call{flex:0 1 auto}
.call.off{background:var(--sunk);color:var(--muted)}
#v{position:fixed;inset:0;background:#000;color:#fff;display:none;flex-direction:column;z-index:10}
#v.on{display:flex}
.vt{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px}
.vt b{font:700 24px/1.1 var(--f-display)}
.vt small{opacity:.7;font-size:14px}
.x{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:rgb(255 255 255/.15);color:#fff;font-size:26px;line-height:1;cursor:pointer}
.strip{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip figure{flex:0 0 100%;margin:0;scroll-snap-align:center;display:grid;place-items:center;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
.strip img{max-width:100%;max-height:100%;object-fit:contain}
.vb{display:flex;gap:10px;align-items:center;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.vb a{flex:1;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:12px;border-radius:var(--r);min-height:44px}
.nav{width:48px;height:44px;border-radius:var(--r);border:0;background:rgb(255 255 255/.15);color:#fff;font-size:22px;cursor:pointer}
.nav:disabled{opacity:.3}
.pg{font-size:14px;opacity:.75;min-width:44px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Winterdienst BAG &amp; HRAG</h1><div class="sub">Aufträge BVB und Areal Letten Allschwil.</div></div>
  </header>
  <div id="tabs"></div>
  <main id="m"><p class="msg">Lade Haltestellen …</p></main>
</div>

<div id="pv" role="dialog" aria-modal="true" aria-label="Arbeitsauftrag"><div class="vt"><div style="flex:1"><b id="pvn"></b><br><small id="pvo"></small></div><button class="x" id="pvx" aria-label="Schliessen">×</button></div><div class="pvs" id="pvs"></div></div>

<div id="v" role="dialog" aria-modal="true" aria-label="Bild der Haltestelle">
  <div class="vt"><div style="flex:1"><b id="vn"></b><br><small id="vo"></small></div><button class="x" id="vx" aria-label="Schliessen">×</button></div>
  <div class="strip" id="vs"></div>
  <div class="vb"><button class="nav" id="vp" aria-label="Vorherige Haltestelle">‹</button><span class="pg" id="vc"></span><a id="vm" href="#" target="_blank" rel="noopener">In Google Maps öffnen</a><button class="nav" id="vnx" aria-label="Nächste Haltestelle">›</button></div>
</div>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G='https://www.google.com/maps/search/?api=1&query=';
const mapsUrl=s=>G+encodeURIComponent(s.maps||(s.name+' '+(s.ort||'')));
const img=f=>'img/'+encodeURIComponent(f);
let L=[],line=null,cur=0,list=[];

function pick(){const hs=location.hash;if(hs==='#team'||hs==='#ablauf'||hs==='#ablauf-letten'||hs==='#extern'||hs==='#pikett'||!hs){line=hs?hs.slice(1):'ablauf';render();return}const h=hs.replace('#linie-','');line=L.find(l=>l.nr===h)||L[0];render()}
function render(){
  const T=(nr,cls,sel,icon,ttl,sub,style)=>`<button class="tab ${cls}" role="tab" aria-selected="${sel}" data-nr="${esc(nr)}"><span class="nr" ${style||''} aria-hidden="true">${icon}</span><span>${ttl}<small>${sub}</small></span></button>`;
  const LT=l=>T(l.nr,'',l===line,esc(l.nr),esc(l.name||l.titel||''),esc(l.name?(l.titel||''):('Linie '+l.nr)),`style="background:${esc(l.farbe||'#555')}"`);
  const grp=(t,c,inner)=>inner?`<section class="auf ${c}"><h3>${t}</h3><div class="tabs" role="tablist">${inner}</div></section>`:'';
  $('tabs').innerHTML=grp('Auftrag BVB · Tramhaltestellen','bvb',T('ablauf','ab',line==='ablauf','!','Ablauf','Meldungen im Einsatz')+L.filter(l=>(l.auftrag||'BVB')==='BVB').map(LT).join(''))
   +grp('Auftrag Areal Letten Allschwil','let',T('ablauf-letten','al',line==='ablauf-letten','!','Ablauf Letten','Reihenfolge im Einsatz')+L.filter(l=>l.auftrag==='Letten').map(LT).join(''))
   +grp('Auftrag BVB · Schneebekämpfung Extern (&gt; 10 cm)','ext',T('extern','ex',line==='extern','A–E','Arbeitsaufträge','Reich · Bertschmann · Weber'))
   +grp('Für alle Aufträge','all',T('team','tm',line==='team','☎','Team','Pikett &amp; Kontakte')+T('pikett','pk',line==='pikett','P','Pikettliste','Wer hat Pikett'));
  if(line==='team'){renderTeam();return}
  if(line==='ablauf'){renderAblauf();return}
  if(line==='ablauf-letten'){renderAblaufLetten();return}
  if(line==='pikett'){renderPikett();return}
  if(line==='extern'){renderExtern();return}
  list=line.haltestellen||[];
  const orte=[...new Set(list.map(s=>s.ort||''))];
  $('m').style.setProperty('--lc',line.farbe||'#555');
  $('m').innerHTML=(list.length?orte.map(o=>`<h2>${esc(o)}</h2><ol>`+list.map((s,k)=>(s.ort||'')!==o?'':`<li><div class="dot"></div><div><div class="name">${esc(s.name)}</div>${s.info?`<div class="sub">${esc(s.info)}</div>`:''}<a class="maps" href="${esc(mapsUrl(s))}" target="_blank" rel="noopener">Google Maps ↗</a></div>${(s.bilder||[]).length?`<button class="thumb" data-k="${k}" aria-label="Bild ${esc(s.name)} anzeigen"><img src="${esc(img(s.bilder[0]))}" alt="" loading="lazy">${s.bilder.length>1?`<span>${s.bilder.length} Bilder</span>`:''}</button>`:'<div class="nobild">Noch kein Bild</div>'}</li>`).join('')+'</ol>').join(''):'<p class="msg">Für diese Linie sind noch keine Haltestellen erfasst.</p>')
;
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){history.replaceState(null,'',['team','ablauf','ablauf-letten','extern','pikett'].includes(b.dataset.nr)?'#'+b.dataset.nr:'#linie-'+b.dataset.nr);pick();window.scrollTo(0,0)}});
window.addEventListener('hashchange',pick);

const v=$('v'),vs=$('vs');
const withImg=()=>list.map((s,k)=>k).filter(k=>(list[k].bilder||[]).length);
function show(k){cur=k;const s=list[k],ix=withImg(),p=ix.indexOf(k);
  $('vn').textContent=s.name;
  $('vo').textContent=(s.ort||'')+(s.bilder.length>1?' · wischen für weiteres Bild':'');
  $('vm').href=mapsUrl(s);
  $('vc').textContent=(p+1)+'/'+ix.length;
  $('vp').disabled=p<=0;$('vnx').disabled=p>=ix.length-1;
  vs.innerHTML=s.bilder.map(f=>`<figure><img src="${esc(img(f))}" alt="Luftbild ${esc(s.name)}"></figure>`).join('');vs.scrollLeft=0;
  if(!v.classList.contains('on')){v.classList.add('on');document.body.style.overflow='hidden';try{history.pushState({v:1},'')}catch(e){}}
}
function close(){v.classList.remove('on');document.body.style.overflow=''}
function step(d){const ix=withImg(),p=ix.indexOf(cur)+d;if(p>=0&&p<ix.length)show(ix[p])}
$('m').addEventListener('click',e=>{const b=e.target.closest('.thumb');if(b)show(+b.dataset.k)});
$('vx').onclick=()=>{close();try{if(history.state&&history.state.v)history.back()}catch(e){}};
window.addEventListener('popstate',close);
$('vp').onclick=()=>step(-1);$('vnx').onclick=()=>step(1);
document.addEventListener('keydown',e=>{if(!v.classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});

// ---- Team / Telefonliste (Daten aus Google-Tabelle über Apps-Script, mit PIN) ----
const EXEC="https://script.google.com/macros/s/AKfycbzcEd33VW0MlSlJQJpKWIXNs1m_97LjkxNCa5t02gvlMs4re8FxhboznemKHLHA0Jvn/exec";
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let people=null,pikett=null;
function telHref(t){return 'tel:'+String(t).replace(/[^\d+]/g,'')}
function pinForm(msg){
  $('m').innerHTML=`<h2>Team &amp; Telefonnummern</h2><p class="sub">Die Nummern sind geschützt. Bitte die Team-PIN eingeben (einmalig auf diesem Handy).</p><form class="pinf" id="pf"><input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN">${msg?`<div class="err">${esc(msg)}</div>`:''}<button type="submit">Anzeigen</button></form>`;
  $('pf').addEventListener('submit',e=>{e.preventDefault();const v=$('pin').value.trim();if(v){store.set('wd-pin',v);loadTeam()}});
  setTimeout(()=>{try{$('pin').focus()}catch(e){}},50);
}
function renderTeam(){
  if(!EXEC||EXEC.startsWith('__')){$('m').innerHTML='<h2>Team &amp; Telefonnummern</h2><p class="msg">Die Telefonliste ist noch nicht verbunden.</p>';return}
  if(people)return showTeam();
  if(!store.get('wd-pin'))return pinForm();
  loadTeam();
}
async function loadTeam(quiet){
  if(!quiet)$('m').innerHTML='<p class="msg">Lade Telefonliste …</p>';
  try{
    const r=await fetch(EXEC+'?pin='+encodeURIComponent(store.get('wd-pin')||'')+'&t='+Date.now(),{credentials:'omit'});
    const d=await r.json();
    if(!d.ok){if(d.error==='pin'){store.del('wd-pin');if(line==='team'||line==='pikett')pinForm('PIN falsch.');return}throw new Error(d.error)}
    people=d.people||[];pikett=Array.isArray(d.pikett)?d.pikett:null;if(line==='team')showTeam();if(line==='ablauf')renderAblauf();if(line==='pikett')renderPikett();
  }catch(e){if(line!=='team'&&line!=='pikett')return;$('m').innerHTML='<p class="msg">Telefonliste konnte nicht geladen werden. Bitte Verbindung prüfen.</p><button class="lnk" id="rt">Nochmals versuchen</button>';$('rt').onclick=()=>loadTeam()}
}
function showTeam(){
  const hl=p=>/leitstelle/i.test(p.name);
  const list=people.filter(p=>p.tel).sort((a,b)=>hl(b)-hl(a));
  $('m').innerHTML='<h2>Team &amp; Telefonnummern</h2>'+(list.length?'<ul class="team">'+list.map(p=>`<li${/leitstelle/i.test(p.name)?' class="hl"':''}><div><b>${esc(p.name)}${p.gruppe?` <span class="grp">(${esc(p.gruppe)})</span>`:''}</b>${p.funktion?`<small>${esc(p.funktion)}</small>`:''}</div><a class="call" href="${esc(telHref(p.tel))}">Anrufen<span>${esc(p.tel)}</span></a></li>`).join('')+'</ul>':'<p class="msg">Noch keine Nummern erfasst.</p>')
   +'<p class="note"><button class="lnk" id="lo">PIN auf diesem Handy löschen</button></p>';
  $('lo').onclick=()=>{store.del('wd-pin');people=null;pinForm()};
}

// ---- Arbeitsaufträge BVB Schneebekämpfung Extern A–E (PDF aus Google Drive über das Apps-Script, mit PIN) ----
const EXT=[
 {b:'A',firma:'Reich AG',r:['Dreirosenbrücke – Bahnhof SBB, Linie 1 (Prio 1)','Aeschenplatz – Zeughaus, Linie 14 (Prio 1)','Bankverein – Heuwaage, Linie 10 (Prio 2)','Heuwaage – IWB, Linie 2 (Prio 3)','St. Alban-Tor – Birsfelden Hard, Linie 3 (Prio 3)']},
 {b:'B',firma:'Reich AG',r:['Tramdepot Allschwilerstrasse (Prio 1)','Morgartenring – Brausebad, Linie 6 (Prio 1)','Aeschenplatz – Bahnhof SBB, Linien 8, 10, 11','Aeschenplatz – Schifflände – Ciba (Prio 1)']},
 {b:'C',firma:'Bertschmann AG',r:['Tramdepot Dreispitz (Prio 1)','Trassen Münchensteinerbrücke (Prio 1)','Bahnhof SBB – Bad. Bahnhof, Linie 2 (Prio 1)','Eglisee – Riehen Grenze, Linie 2 (Prio 2)','Kleinhüningen – Weil Grenze – Ciba, Linie 8 (Prio 2)']},
 {b:'D',firma:'Weber Forstdienst',r:['Tramdepot Wiesenplatz (Prio 1)','Saint-Louis Grenze – Schifflände, Linie 11 (Prio 3)','Barfüsserplatz – Burgfelderhof, Linie 3 (Prio 3)','Brausebad – Heuwaage, Linie 6 (Prio 3)']},
 {b:'E',firma:'Weber Forstdienst',r:['Busprovisorium Klybeck (Prio 1)','Hauptwerkstätte Klybeck (Prio 2)','Morgartenring – Allschwil, Linie 6 (Prio 2)']}
];
function renderExtern(){
  const firmen=[...new Set(EXT.map(x=>x.firma))];
  $('m').innerHTML='<h2>Arbeitsaufträge Schneebekämpfung Extern</h2>'+firmen.map(f=>`<h2>${esc(f)}</h2><ul class="aa">`+EXT.filter(x=>x.firma===f).map(x=>`<li><span class="bx">${x.b}</span><div><b>Arbeitsauftrag ${x.b}</b><ul>${x.r.map(r=>`<li style="display:list-item;padding:0;border:0;background:none">${esc(r)}</li>`).join('')}</ul><button class="open" data-b="${x.b}">Plan öffnen</button></div></li>`).join('')+'</ul>').join('');
}
let pdfLib=null;
function loadPdfLib(){if(pdfLib)return pdfLib;pdfLib=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok(window.pdfjsLib)};s.onerror=()=>{pdfLib=null;no(new Error('lib'))};document.head.appendChild(s)});return pdfLib}
const pdfCache={};
async function openAuftrag(b){
  const pv=$('pv'),ps=$('pvs');const x=EXT.find(e=>e.b===b);
  $('pvn').textContent='Arbeitsauftrag '+b;$('pvo').textContent=x?x.firma:'';
  ps.innerHTML='<p class="msg">Plan wird geladen …</p>';pv.classList.add('on');document.body.style.overflow='hidden';
  try{history.pushState({pv:1},'')}catch(e){}
  if(!store.get('wd-pin')){ps.innerHTML='<p class="msg">Bitte zuerst im Tab «Team» die Team-PIN eingeben.</p>';return}
  try{
    let d=pdfCache[b];
    if(!d){const r=await fetch(EXEC+'?pin='+encodeURIComponent(store.get('wd-pin'))+'&auftrag='+b+'&t='+Date.now(),{credentials:'omit'});d=await r.json();if(!d.ok)throw new Error(d.error||'fehler');pdfCache[b]=d}
    const lib=await loadPdfLib();
    const bin=atob(d.data),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const doc=await lib.getDocument({data:bytes}).promise;
    if(!pv.classList.contains('on'))return;
    ps.innerHTML='';const W=Math.min(ps.clientWidth-16,1100),dpr=Math.min(window.devicePixelRatio||1,2);
    for(let n=1;n<=doc.numPages;n++){
      const pg=await doc.getPage(n);const v0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:W/v0.width*dpr*1.5});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;ps.appendChild(c);
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      if(!pv.classList.contains('on'))return;
    }
  }catch(e){ps.innerHTML='<p class="msg">'+(String(e.message)==='pin'?'PIN falsch. Bitte im Tab «Team» neu eingeben.':'Plan konnte nicht geladen werden. Bitte Verbindung prüfen.')+'</p>'}
}
function closeAuftrag(){$('pv').classList.remove('on');document.body.style.overflow=''}
$('m').addEventListener('click',e=>{const b=e.target.closest('.open');if(b)openAuftrag(b.dataset.b)});
$('pvx').onclick=()=>{closeAuftrag();try{if(history.state&&history.state.pv)history.back()}catch(e){}};
window.addEventListener('popstate',closeAuftrag);

// ---- Pikettliste (Daten nur über das Apps-Script, mit PIN) ----
let pDay=null;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function pikettToday(){const n=new Date();if(n.getHours()<6)n.setDate(n.getDate()-1);return n}
function telFor(name){const t=name.toLowerCase().replace(/[()]/g,'').split(/\s+/).filter(x=>x.length>2);return (people||[]).find(p=>p.tel&&t.every(w=>p.name.toLowerCase().includes(w)))}
let pMode='list',pStart=null,pMonth=null;
const PSW=()=>`<div class="pseg"><button data-pm="list" aria-pressed="${pMode==='list'}">Liste</button><button data-pm="table" aria-pressed="${pMode==='table'}">Tabelle</button></div>`;
document.addEventListener('click',e=>{const b=e.target.closest('.pseg button');if(b){pMode=b.dataset.pm;renderPikett()}});
function renderPikettTable(){
  const t=pikettToday();if(!pMonth)pMonth=new Date(t.getFullYear(),t.getMonth(),1);
  const y=pMonth.getFullYear(),mo=pMonth.getMonth(),dim=new Date(y,mo+1,0).getDate(),pre=y+'-'+String(mo+1).padStart(2,'0')+'-';
  const rows=pikett.filter(r=>r[0].startsWith(pre));
  const tk=iso(t);
  const wdN=['So','Mo','Di','Mi','Do','Fr','Sa'];
  const days=[...Array(dim)].map((_,i)=>i+1);
  const groups=[...new Set(pikett.map(r=>r[1]))];
  let body='';
  groups.forEach(g=>{
    const names=[...new Set(rows.filter(r=>r[1]===g).map(r=>r[2]))];
    if(!names.length)return;
    body+=`<tr class="tg"><th colspan="${dim+1}">${esc(SHORT(g))}</th></tr>`;
    names.forEach(n=>{
      body+=`<tr><th class="tn">${esc(n)}</th>`+days.map(d=>{const k=pre+String(d).padStart(2,'0');const r=rows.find(x=>x[1]===g&&x[2]===n&&x[0]===k);const we=[0,6].includes(new Date(y,mo,d).getDay());
        if(!r)return `<td class="${we?'we':''}${k===tk?' td':''}"></td>`;
        return r[3]==='Pikett'?`<td class="on${k===tk?' td':''}" title="Pikett">●</td>`:`<td class="nt${k===tk?' td':''}" title="${esc(r[3])}">${esc(r[3]==='ABWESEND'?'A':'!')}</td>`}).join('')+'</tr>';
    });
  });
  const mname=pMonth.toLocaleDateString('de-CH',{month:'long',year:'numeric'});
  $('m').innerHTML=`<h2>Pikettliste</h2>${PSW()}<div class="pnav"><button id="mp" aria-label="Voriger Monat">‹</button><div><b>${esc(mname)}</b><small>● Pikett · A abwesend · ! Bemerkung (antippen)</small></div><button id="mn" aria-label="Nächster Monat">›</button></div>`
   +(body?`<div class="ptw"><table class="ptab"><thead><tr><th class="tn"></th>${days.map(d=>{const dd=new Date(y,mo,d);const k=pre+String(d).padStart(2,'0');return `<th class="${[0,6].includes(dd.getDay())?'we':''}${k===tk?' td':''}"><span>${wdN[dd.getDay()]}</span>${d}</th>`}).join('')}</tr></thead><tbody>${body}</tbody></table></div><p class="msg" id="pnote"></p><p><a class="maps" href="https://drive.google.com/file/d/1WkbZplxfYwV5KYXv0GOUtp3JyYjZZMYR/view" target="_blank" rel="noopener">Excel-Datei in Google Drive öffnen ↗</a></p>`:'<p class="msg">Für diesen Monat ist nichts eingetragen.</p>');
  $('mp').onclick=()=>{pMonth=new Date(y,mo-1,1);renderPikettTable()};
  $('mn').onclick=()=>{pMonth=new Date(y,mo+1,1);renderPikettTable()};
  const tb=$('m').querySelector('.ptab');
  if(tb){tb.onclick=ev=>{const c=ev.target.closest('td.nt');if(c)$('pnote').textContent=c.closest('tr').querySelector('.tn').textContent+': '+c.title};
    const tc=tb.querySelector('thead th.td');if(tc)tc.scrollIntoView({block:'nearest',inline:'center'})}
}

const SHORT=g=>g.replace(/^Gruppe \S+ · /,'');
function renderPikett(){
  if(!EXEC||EXEC.startsWith('__')){$('m').innerHTML='<p class="msg">Die Pikettliste ist noch nicht verbunden.</p>';return}
  if(!people){if(!store.get('wd-pin'))return pinForm();return loadTeam()}
  if(!pikett){$('m').innerHTML='<h2>Pikettliste</h2><p class="msg">Die Pikettliste ist noch nicht freigeschaltet.</p>';return}
  if(pMode==='day')return renderPikettDay();
  if(pMode==='table')return renderPikettTable();
  if(!pStart)pStart=pikettToday();
  const N=14,tk=iso(pikettToday());let html='';
  for(let i=0;i<N;i++){
    const d=new Date(pStart);d.setDate(d.getDate()+i);const k=iso(d),rows=pikett.filter(r=>r[0]===k);
    const gs=[...new Set(rows.map(r=>r[1]))];
    html+=`<li class="pday${k===tk?' now':''}" data-d="${k}"><div class="pdh"><b>${esc(d.toLocaleDateString('de-CH',{weekday:'short',day:'numeric',month:'short'}))}</b>${k===tk?'<span>heute</span>':''}</div>`
      +(rows.length?gs.map(g=>`<div class="pgr"><span class="pgl">${esc(SHORT(g))}</span><span>${rows.filter(r=>r[1]===g).map(r=>esc(r[2])+(r[3]!=='Pikett'?` <em>(${esc(r[3])})</em>`:'')).join(', ')}</span></div>`).join(''):'<div class="pgr"><span>Kein Pikett eingetragen</span></div>')+'</li>';
  }
  const e=new Date(pStart);e.setDate(e.getDate()+N-1);
  $('m').innerHTML=`<h2>Pikettliste</h2>${PSW()}<div class="pnav"><button id="pp" aria-label="Frühere Tage">‹</button><div><b>${esc(pStart.toLocaleDateString('de-CH',{day:'numeric',month:'short'}))} – ${esc(e.toLocaleDateString('de-CH',{day:'numeric',month:'short',year:'numeric'}))}</b><small>Tag antippen für Details</small></div><button id="pn" aria-label="Spätere Tage">›</button></div>${iso(pStart)===tk?'':'<button class="today" id="pt">Zu heute</button>'}<ul class="plist">${html}</ul>`;
  $('pp').onclick=()=>{pStart.setDate(pStart.getDate()-N);renderPikett()};
  $('pn').onclick=()=>{pStart.setDate(pStart.getDate()+N);renderPikett()};
  if($('pt'))$('pt').onclick=()=>{pStart=null;renderPikett()};
  $('m').querySelector('.plist').onclick=ev=>{const li=ev.target.closest('.pday');if(!li)return;const [y,mo,da]=li.dataset.d.split('-').map(Number);pDay=new Date(y,mo-1,da);pMode='day';renderPikettDay();window.scrollTo(0,0)};
}
function renderPikettDay(){
  if(!EXEC||EXEC.startsWith('__')){$('m').innerHTML='<p class="msg">Die Pikettliste ist noch nicht verbunden.</p>';return}
  if(!people){if(!store.get('wd-pin'))return pinForm();return loadTeam()}
  if(!pDay)pDay=pikettToday();
  const key=iso(pDay),rows=pikett.filter(r=>r[0]===key);
  const wd=pDay.toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const isToday=key===iso(pikettToday());
  const groups=[...new Set(rows.map(r=>r[1]))];
  $('m').innerHTML=`<button class="today" id="pb" style="margin:0">‹ Übersicht</button><div class="pnav"><button id="pp" aria-label="Vorheriger Tag">‹</button><div><b>${esc(wd)}</b>${isToday?'<small>heute</small>':''}</div><button id="pn" aria-label="Nächster Tag">›</button></div>${isToday?'':'<button class="today" id="pt">Zu heute</button>'}`
   +(rows.length?groups.map(g=>`<h2>${esc(SHORT(g))}</h2><ul class="team">`+rows.filter(r=>r[1]===g).map(r=>{const p=telFor(r[2]);return `<li><div><b>${esc(r[2])}</b>${r[3]!=='Pikett'?`<span class="st">${esc(r[3])}</span>`:''}</div>${p&&r[3]==='Pikett'?`<a class="call" href="${esc(telHref(p.tel))}">Anrufen<span>${esc(p.tel)}</span></a>`:''}</li>`}).join('')+'</ul>').join(''):'<p class="msg">Für diesen Tag ist kein Pikett eingetragen.</p>');
  $('pp').onclick=()=>{pDay.setDate(pDay.getDate()-1);renderPikettDay()};
  $('pn').onclick=()=>{pDay.setDate(pDay.getDate()+1);renderPikettDay()};
  $('pb').onclick=()=>{pMode='list';renderPikett()};
  if($('pt'))$('pt').onclick=()=>{pDay=null;renderPikettDay()};
}

 {t:'Abmeldung Frankreich bei erster Haltestelle in Birsfelden',d:'Wenn Frankreich fertig ist: bei der ersten Haltestelle in Birsfelden die Leitstelle anrufen und Frankreich abmelden. Abmeldung auch im Gruppenchat melden.',c:['leitstelle'],key:1},

function renderAblaufLetten(){

}
function renderAblauf(){
  if(!people&&store.get('wd-pin')&&EXEC&&!EXEC.startsWith('__')&&!renderAblauf.busy){renderAblauf.busy=1;loadTeam(1).finally(()=>{renderAblauf.busy=0})}
  const btn=k=>{const p=findP(k);return p?`<a class="call" href="${esc(telHref(p.tel))}">${esc(p.name.replace(/\s*\(.*\)/,''))}<span>${esc(p.tel)}</span></a>`:''};
  const locked=!people;

}

fetch('haltestellen.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{L=d.linien||[];if(!L.length)throw 0;pick()}).catch(()=>{$('m').innerHTML='<p class="msg">Haltestellen konnten nicht geladen werden. Bitte Verbindung prüfen und neu laden.</p>'});
}
